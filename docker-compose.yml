services:
  beheerpagina:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:-8000}:8000"
      - "${MIRROR_STREAM_PORT:-8091}:8091"
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD moet gezet zijn in .env}
      MQTT_HOST: ${MQTT_HOST:-homeassistant.local}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USER: ${MQTT_USER:-}
      MQTT_PASS: ${MQTT_PASS:-}
      HA_URL: ${HA_URL:-http://homeassistant.local:8123}
      HA_TOKEN: ${HA_TOKEN:-}
      ADMIN_PORT: 8000
      ADMIN_DB_PATH: /data/admin.db
      ADMIN_MEDIA_DIR: /data/media_store
      LOG_DIR: /data/logs
    volumes:
      - ./data:/data
